##### Prefix #####
# Keep default (C-b). Uncomment if you want C-a instead.
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

##### Terminal / Colors #####
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Truecolor for common terminals
set -as terminal-overrides ",*:RGB"


##### History #####
set -g history-limit 100000

##### Mouse + Scrollback #####
set -g mouse on

# Wheel scroll: enter copy-mode on first scroll-up; otherwise pass mouse scroll to app
bind -T root WheelUpPane if-shell -F "#{pane_in_mode}" \
  "send-keys -M" \
  "if-shell -F '#{alternate_on}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -T root WheelDownPane if-shell -F "#{pane_in_mode}" \
  "send-keys -M" \
  "if-shell -F '#{alternate_on}' 'send-keys -M' 'send-keys -M'"

##### Copy-mode (vim-style) #####
setw -g mode-keys vi

# Basic vi-style bindings in copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Escape send -X cancel

# (Optional) auto-copy to system clipboard when yanking, if pbcopy/xclip exists
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "if-shell 'command -v xclip >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"xclip -selection clipboard -in\"'"

##### Splits #####
# Easier split bindings (prefix + | and prefix + -)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Make splits use current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### Window & Pane Navigation #####
# Switch panes with Alt + arrows
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Quickly switch windows with Ctrl + arrows
bind -n C-Left  previous-window
bind -n C-Right next-window
bind n next-window
bind p previous-window
bind w choose-tree -Zw   # window/session tree picker

##### Status Bar #####
set -g status-interval 5
set -g status-justify centre
set -g status-bg black
set -g status-fg white

# Left: session + window
set -g status-left-length 40
set -g status-left "#[bold]#S #[default] #I:#W "

# Right: time + date + host
set -g status-right-length 100
set -g status-right "#(whoami)@#H  %Y-%m-%d  %H:%M "

##### Misc Quality-of-life #####
# Reload config: prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Use base index 1 for windows & panes
set -g base-index 1
setw -g pane-base-index 1

# Allow renaming windows automatically based on command
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# Focus events (helps some editors like nvim)
set -g focus-events on

# New window in current pane's directory
bind c new-window -c "#{pane_current_path}"

