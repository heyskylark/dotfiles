# --- General -------------------------------------------------
general {
  # Swaylock: ignore-empty-password
  ignore_empty_input = true
}

# --- Background (Swaylock: color=2b2e37) --------------------
background {
  color = rgba(43, 46, 55, 1.0)   # #2b2e37
}

# --- Input Field (acts like the circular indicator) ---------
# Swaylock radius=120  → size 240x240 with full rounding.
# Colors mapped from your swaylock:
#   ring-color           -> outer_color
#   inside-color         -> inner_color
#   ring-ver/inside-ver  -> check_color (verify state)
#   inside-wrong-color   -> fail_color
# Notes:
# - Hyprlock doesn’t have separate “line-color”; the outline/border is outer_color.
# - key-hl-color doesn’t have a perfect equivalent; see notes below.
input-field {
  size = 70, 70
  rounding = -1               # full circle / oval
  outline_thickness = 0       # shows a visible ring/border
  dots_center = true
  dots_size = 0.05
  fade_on_empty = false       # Swaylock: indicator-idle-visible

  # Ring/inside/base
  outer_color = rgba(43, 46, 55, 1.0)   # ring-color=2b2e37
  inner_color = rgba(43, 46, 55, 1.0)   # inside-color=2b2e37

  # Verify / wrong states
  check_color = rgba(43, 46, 55, 1.0)   # ring-ver/inside-ver=2b2e37
  fail_color  = rgba(241, 93, 34, 1.0)  # inside-wrong-color=F15D22

  # Text
  font_color  = rgba(238, 238, 238, 1.0) # text-color=eeeeee
  font_family = Sans
  # Swaylock style dots are already default; leave hide_input=false
  # hide_input = true  # (optional) if you prefer block “swaylock-style” indicator instead of dots
}

# --- Keyboard layout label (Swaylock: show-keyboard-layout) --
label {
  text = $LAYOUT               # shows current layout
  color = rgba(238, 238, 238, 1.0)   # text-color=eeeeee
  font_size = 10                       # font-size=16
  position = 0, 90
  halign = center
  valign = center
}

# --- Failed attempts label (Swaylock: show-failed-attempts) --
label {
  text = <span size="large">$ATTEMPTS failed attempt(s)</span>
  color = rgba(238, 238, 238, 1.0)
  font_size = 10
  position = 0, 150
  halign = center
  valign = center
}

